# Gemma 4 E2B-it closed-QA training config.
#
# Differs from gemma-2 / mistral / qwen counterparts in two places:
#   1. target_modules excludes k_proj and v_proj. Gemma 4 has 4 dimension
#      profiles across its 35 layers; the largest profile (16 layers, picked
#      by select_majority_dim_group) shares only q/o/gate/up/down. KV is
#      unified or shaped differently in some profile groups, so including
#      k_proj or v_proj here would either (a) push the layer-grouping picker
#      onto a smaller profile or (b) flag the dropped modules at runtime.
#   2. Data paths reference self_gen/google/gemma-4-E2B-it/* which must be
#      generated first (see scripts/main_exp/gen_data.sh). The pipeline is
#      identical to the gemma-2 self_gen flow; only the q-generation model
#      changes.

# LoRA
lora_r: 8
lora_dropout: 0.0
target_modules:
  - q_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# KL loss requires teacher-generated logprobs columns (logprobs_vals,
# logprobs_indices) in the dataset. SakanaAI's self_gen produces those;
# cocoon's code_qa_gen.py does not, so KL is off for cocoon training.
# Re-enable once the cocoon pipeline generates logprob distillation
# targets (would need a separate teacher-model pass over queries.jsonl).
use_kl_loss: false

ctx_encoder_type: per_layer_activations
n_latent_queries: 8
num_blocks: 9
num_self_attn_per_block: 0

gradient_accumulation_steps: 11
max_packed_inp_len: 6144
max_packed_ctx_len: 6144

# data — cocoon code-QA (queries.jsonl converted via queries_to_parquet.py).
# Registered as cocoon_code_qa in DS_KWARGS; the parquet must live at
# data/raw_datasets/cocoon_code_qa/train/ds.parquet on the trainer's filesystem.
train_ds_names:
  - cocoon_code_qa

# val_ds_names is parsed but unused unless --eval_strategy != "no" (default
# in the launch script is "no"). Left empty for the first training run.
val_ds_names: []
