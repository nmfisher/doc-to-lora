# Gemma 4 E2B-it closed-QA training config.
#
# Differs from gemma-2 / mistral / qwen counterparts in two places:
#   1. target_modules excludes k_proj and v_proj. Gemma 4 has 4 dimension
#      profiles across its 35 layers; the largest profile (16 layers, picked
#      by select_majority_dim_group) shares only q/o/gate/up/down. KV is
#      unified or shaped differently in some profile groups, so including
#      k_proj or v_proj here would either (a) push the layer-grouping picker
#      onto a smaller profile or (b) flag the dropped modules at runtime.
#   2. Data paths reference self_gen/google/gemma-4-E2B-it/* which must be
#      generated first (see scripts/main_exp/gen_data.sh). The pipeline is
#      identical to the gemma-2 self_gen flow; only the q-generation model
#      changes.

# LoRA
lora_r: 8
lora_dropout: 0.0
target_modules:
  - q_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# KL loss requires teacher-generated logprobs columns (logprobs_vals,
# logprobs_indices) in the dataset. SakanaAI's self_gen produces those;
# cocoon's code_qa_gen.py does not, so KL is off for cocoon training.
# Re-enable once the cocoon pipeline generates logprob distillation
# targets (would need a separate teacher-model pass over queries.jsonl).
use_kl_loss: false

ctx_encoder_type: per_layer_activations
# Cap the encoder layer count so the perceiver's per-layer rearrange dim
# matches len(layer_indices). PerLayerActivations does
# `base_model.layers = base_model.layers[:ctx_encoder_last_layer - 1]`,
# so this gives layers[:15] = 15 layers + 1 embed output = 16 hidden
# states, matching aggregator.num_layers = len(layer_indices) = 16
# (Gemma 4 majority dim group). Without this we'd get 35 encoder hidden
# states vs 16 decoder layers, causing the position_ids repeat (uses
# self.num_layers=16) to disagree with the ctx_features rearrange (uses
# the actual encoder dim=35). Same setup as SakanaAI Gemma 2 where
# 26 encoder layers == 26 decoder layers by coincidence.
ctx_encoder_last_layer: 16
# Per-segment latent count. With per_layer_activations + position_ids,
# the perceiver runs N segments (one per encoder layer) each with
# n_latent_queries latents, so effective latents = N * n_latent_queries.
# SakanaAI Gemma 2 used 8 latents × 26 layers = 208 effective. For us:
# 16 latents × 16 layers = 256 effective (slightly more capacity).
n_latent_queries: 16
# Full depth — perceiver attention is SDPA EFFICIENT_ATTENTION with a
# flatten-Q + block-diagonal mask so K/V aren't expanded across the
# per-segment Q batch. See idefics2.py Idefics2PerceiverFlashAttention2.
num_blocks: 9
num_self_attn_per_block: 0

# HF defaults for max_grad_norm (1.0) and learning_rate (5e-5) work here:
# with the SDPA stability fix landed, real grad_norm is ~0.78, not the
# 1e+6 we saw with the broken flash backward. We previously bumped
# max_grad_norm to 1e+5 and lr to 1e-4 to compensate for clipping
# pathological gradients caused by the backward NaN; both are now
# unnecessary.
gradient_accumulation_steps: 11
# Cocoon's 64K-char repo windows are ~16-20K tokens; max_packed_ctx_len
# of 32K OOM'd the A100-80GB at training time, so back off to 16K. Items
# above the limit are silently dropped by pack_data_points_by_length;
# the longer cocoon contexts will get skipped here. If that's lossy
# enough to hurt, drop WINDOW_CHARS in code_qa_gen.py to ~40K instead.
max_packed_inp_len: 2048
max_packed_ctx_len: 8192

# data — cocoon code-QA (queries.jsonl converted via queries_to_parquet.py).
# Registered as cocoon_code_qa in DS_KWARGS; the parquet must live at
# data/raw_datasets/cocoon_code_qa/train/ds.parquet on the trainer's filesystem.
train_ds_names:
  - cocoon_code_qa

# val_ds_names is parsed but unused unless --eval_strategy != "no" (default
# in the launch script is "no"). Left empty for the first training run.
val_ds_names: []
